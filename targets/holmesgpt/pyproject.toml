[project]
name = "agent-drill-holmesgpt"
version = "0.1.0"
requires-python = ">=3.12,<3.14"
dependencies = [
    "atif==1.7.0",
    "holmesgpt==0.46.0",
    "pydantic==2.14.3",
]

[dependency-groups]
dev = [
    "ruff==0.8.4",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "C4", "SIM"]
ignore = ["E501"]
